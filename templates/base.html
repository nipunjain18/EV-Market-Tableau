<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EV360 | Global Electric Vehicle Market Analytics{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <!-- Tableau Embedding API v3 -->
  <script type="module" src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js"></script>
</head>
<body>
  <!-- Sticky Floating Pill Navbar -->
  <div class="nav-wrapper">
    <header class="floating-nav">
      <a href="{{ url_for('home') }}" class="brand-wrapper">
        <div class="brand-badge">E</div>
        <span class="brand-name">EV360</span>
      </a>

      <!-- Navigation Pill Links -->
      <nav class="nav-menu">
        <a href="#home" class="nav-item active" id="nav-home">Home</a>
        <a href="#about" class="nav-item" id="nav-about">About</a>
        <a href="#dashboard" class="nav-item" id="nav-dashboard">Dashboard</a>
        <a href="#story" class="nav-item" id="nav-story">Story</a>
        <a href="#faq" class="nav-item" id="nav-faq">FAQ</a>
      </nav>

      <div class="nav-actions">
        <a href="{{ github_url }}" target="_blank" rel="noopener" class="btn-pill btn-outline btn-sm-pill" title="View Source on GitHub">
          GitHub &nearr;
        </a>
      </div>
    </header>
  </div>

  <!-- Main Body Content -->
  <main class="site-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Clean Minimal Footer -->
  <footer class="minimal-footer">
    <div class="footer-inner">
      <div class="footer-copy">
        <p><strong>EV360</strong> &middot; Electric Vehicle Market Analytics &middot; Developed by {{ student_name }}</p>
      </div>
      <div class="footer-nav">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#dashboard">Dashboard</a>
        <a href="#story">Story</a>
        <a href="#faq">FAQ</a>
        <a href="{{ url_for('report') }}" target="_blank">PDF Report &nearr;</a>
        <a href="{{ github_url }}" target="_blank" rel="noopener">GitHub &nearr;</a>
      </div>
    </div>
  </footer>

  <!-- Light interactive script for active navbar states and FAQ toggle -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // FAQ Accordion Toggle
      const faqItems = document.querySelectorAll('.faq-item');
      faqItems.forEach(item => {
        const question = item.querySelector('.faq-question');
        question.addEventListener('click', () => {
          const isActive = item.classList.contains('active');
          faqItems.forEach(i => i.classList.remove('active'));
          if (!isActive) {
            item.classList.add('active');
          }
        });
      });

      // Active Navigation State on Scroll
      const sections = document.querySelectorAll('section[id]');
      const navItems = document.querySelectorAll('nav.nav-menu a.nav-item');

      window.addEventListener('scroll', () => {
        let current = '';
        sections.forEach(section => {
          const sectionTop = section.offsetTop - 120;
          if (pageYOffset >= sectionTop) {
            current = section.getAttribute('id');
          }
        });

        navItems.forEach(item => {
          item.classList.remove('active');
          if (item.getAttribute('href') === `#${current}`) {
            item.classList.add('active');
          }
        });
      });
    });
  </script>
</body>
</html>
