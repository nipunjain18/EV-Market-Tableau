services:
  - type: web
    name: ev-market-analysis
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TABLEAU_STORY_URL
        value: https://public.tableau.com/views/EVMarketAnalysis_17932840807840/Story1?:language=en-US&publish=yes&:display_count=n&:origin=viz_share_link
      - key: TABLEAU_DASHBOARD_URL
        value: https://public.tableau.com/views/EVMarketAnalysis_17932840807840/MarketOverview

